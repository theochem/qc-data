[project]
name = "qc-data"
authors = [
  { name = "QC-Devs Community", email = "qcdevs@gmail.com" },
]
description = "qc-data performs data retrieval and caching for QC-Devs packages"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering",
]
dependencies = ["pooch>=1.8,<2"]
dynamic = ["version"]

[project.optional-dependencies]
test = ["pytest>=8"]
dev = [
    "pytest>=8",
    "pre-commit>=4",
]

[tool.black]
line-length = 100

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = [
    "E4",  # Import and syntax-related style errors
    "E7",  # Statement-related style errors
    "E9",  # Runtime and syntax errors
    "F",   # Pyflakes
    "I",   # Import sorting
    "B",   # Bugbear: common programming mistakes
]

[build-system]
requires = ["setuptools>=80", "setuptools-scm[simple]>=9.2"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["src"]
